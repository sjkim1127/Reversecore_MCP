{% extends "base.html" %}
{% block title %}Overview - Reversecore MCP{% endblock %}

{% block content %}
<div class="page-header">
    <h2>📁 Workspace Overview</h2>
    <p class="subtitle">{{ workspace }}</p>
</div>

<div class="section">
    <h3>📊 System Metrics</h3>
    <div hx-get="/dashboard/api/metrics-fragment" hx-trigger="load, every 5s" hx-swap="innerHTML">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value">Loading...</span>
                <span class="stat-label">System Metrics</span>
            </div>
        </div>
    </div>
</div>

<div class="section">
    <h3>📄 Files in Workspace</h3>
    <div hx-get="/dashboard/api/files-fragment" hx-trigger="load, every 10s" hx-swap="innerHTML">
        <div class="empty-state">
            <p>Loading files...</p>
        </div>
    </div>
</div>
{% endblock %}
