rules:
  # ── C/C++ Rules (Regex-based) ────────────────────────────────────────────────
  - id: "RCMCP-SAST-C-001"
    language: "c"
    severity: "critical"
    pattern: "\\bstrcpy\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of dangerous function 'strcpy'. It does not perform bounds checking and is a common source of buffer overflows. Use 'strncpy' or 'strlcpy' instead."

  - id: "RCMCP-SAST-C-002"
    language: "c"
    severity: "critical"
    pattern: "\\bgets\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of highly dangerous function 'gets'. It is impossible to use safely because it does not limit input size. Use 'fgets' instead."

  - id: "RCMCP-SAST-C-003"
    language: "c"
    severity: "critical"
    pattern: "\\bsprintf\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of potentially unsafe 'sprintf'. If formatting unchecked input, it can cause buffer overflow. Use 'snprintf' instead."

  - id: "RCMCP-SAST-C-004"
    language: "c"
    severity: "critical"
    pattern: "\\bstrcat\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of dangerous function 'strcat'. It does not perform bounds checking and can overflow destination buffers. Use 'strncat' instead."

  - id: "RCMCP-SAST-C-005"
    language: "c"
    severity: "critical"
    pattern: "\\bvsprintf\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of dangerous function 'vsprintf'. Use 'vsnprintf' instead to prevent buffer overflows."

  - id: "RCMCP-SAST-C-006"
    language: "c"
    severity: "critical"
    pattern: "\\bsystem\\b"
    match_type: "regex"
    category: "Command Injection"
    message: "Execution of command shell via 'system'. Ensure the argument is not influenced by user input."

  - id: "RCMCP-SAST-C-007"
    language: "c"
    severity: "critical"
    pattern: "\\bpopen\\b"
    match_type: "regex"
    category: "Command Injection"
    message: "Execution of command shell via 'popen'. Ensure the argument is not influenced by user input."

  - id: "RCMCP-SAST-C-008"
    language: "c"
    severity: "critical"
    pattern: "\\bexec(ve|l|lp|v|vp)\\b"
    match_type: "regex"
    category: "Command Injection"
    message: "Process execution via 'exec*'. Ensure arguments are sanitized and not user-controlled."

  - id: "RCMCP-SAST-C-009"
    language: "c"
    severity: "medium"
    pattern: "\\b(printf|fprintf|syslog)\\b"
    match_type: "regex"
    category: "Format String"
    message: "Potential Format String vulnerability if user-controlled input is passed directly as the format argument."

  - id: "RCMCP-SAST-C-010"
    language: "c"
    severity: "medium"
    pattern: "\\bmemcpy\\b"
    match_type: "regex"
    category: "Buffer Overflow"
    message: "Use of 'memcpy'. Ensure size argument is validated and does not exceed destination buffer capacity."

  - id: "RCMCP-SAST-C-011"
    language: "c"
    severity: "low"
    pattern: "\\bmalloc\\b"
    match_type: "regex"
    category: "Memory Management"
    message: "Memory allocation using 'malloc'. Check for integer overflow in size calculation, and verify the return value is not NULL."

  # ── Python Rules (AST-based) ────────────────────────────────────────────────
  - id: "RCMCP-SAST-PY-001"
    language: "python"
    severity: "critical"
    pattern: "eval"
    match_type: "ast"
    category: "Code Execution"
    message: "Use of 'eval()' is extremely dangerous. It compiles and evaluates arbitrary Python expressions."

  - id: "RCMCP-SAST-PY-002"
    language: "python"
    severity: "critical"
    pattern: "exec"
    match_type: "ast"
    category: "Code Execution"
    message: "Use of 'exec()' is extremely dangerous. It compiles and evaluates arbitrary Python statements/code."

  - id: "RCMCP-SAST-PY-003"
    language: "python"
    severity: "critical"
    pattern: "pickle.loads"
    match_type: "ast"
    category: "Insecure Deserialization"
    message: "Insecure deserialization using 'pickle.loads()'. Deserializing untrusted data can lead to arbitrary code execution."

  - id: "RCMCP-SAST-PY-004"
    language: "python"
    severity: "high"
    pattern: "os.system"
    match_type: "ast"
    category: "Command Injection"
    message: "Execution of command shell via 'os.system'. Ensure the argument is not influenced by user input."

  - id: "RCMCP-SAST-PY-005"
    language: "python"
    severity: "high"
    pattern: "subprocess.Popen"
    match_type: "ast"
    category: "Command Injection"
    message: "Use of 'subprocess.Popen' with shell=True is dangerous and can lead to command injection."

  - id: "RCMCP-SAST-PY-006"
    language: "python"
    severity: "high"
    pattern: "subprocess.run"
    match_type: "ast"
    category: "Command Injection"
    message: "Use of 'subprocess.run' with shell=True is dangerous and can lead to command injection."

  - id: "RCMCP-SAST-PY-007"
    language: "python"
    severity: "high"
    pattern: "subprocess.call"
    match_type: "ast"
    category: "Command Injection"
    message: "Use of 'subprocess.call' with shell=True is dangerous and can lead to command injection."

  - id: "RCMCP-SAST-PY-008"
    language: "python"
    severity: "high"
    pattern: "yaml.load"
    match_type: "ast"
    category: "Insecure Deserialization"
    message: "Use of unsafe 'yaml.load()'. Use 'yaml.safe_load()' instead to prevent arbitrary object instantiation."

  - id: "RCMCP-SAST-PY-009"
    language: "python"
    severity: "medium"
    pattern: "tempfile.mktemp"
    match_type: "ast"
    category: "Insecure Temp File"
    message: "Use of unsafe 'tempfile.mktemp()'. It is deprecated and vulnerable to race conditions. Use 'tempfile.mkstemp()' instead."
