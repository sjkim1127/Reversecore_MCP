[project]
name = "reversecore-mcp"
version = "2.1.0"
description = "A security-first MCP server that empowers AI agents to perform automated reverse engineering, malware analysis, forensics, vulnerability research, and SAST — powered by Radare2, YARA, LIEF, Capstone, and more."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Core MCP server dependencies
    "mcp[cli]>=1.27.0",
    "fastmcp>=2.13.0,<4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.27",
    "aiofiles>=24.0.0",
    "aiofile<=3.9.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "orjson>=3.11.9",

    # Core functionality dependencies
    "jinja2>=3.1.0",
    "async-lru>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiosmtplib>=5.1.0",
    "python-dotenv>=1.2.2",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "pillow>=12.2.0",
    "markdown>=3.6.0",
    "xhtml2pdf>=0.2.16",
    "numpy<2.3.0",
    "contourpy<1.3.3",
    "pyxbe<=1.0.3",
    "pyxdia<=0.1.0",
]

[project.optional-dependencies]
# Binary analysis tools
analysis = [
    "pefile>=2023.0.0",
    "lief>=0.17.6",
    "capstone>=5.0.0",
    "keystone-engine>=0.9.2",
    "yara-python>=4.5.4",
    "r2pipe>=1.9.8",
    "angr>=9.2.0,<=9.2.213",
    "flare-capa>=7.0.0",
]

# Visualization (CFG, graphs)
viz = [
    "graphviz>=0.20.0",
    "networkx>=3.4.2,<3.5",
    "matplotlib>=3.8.0,<3.11",
]


# CLI and utilities
cli = [
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "typer>=0.25.1",
    "rich>=13.0.0",
]

# Optional dependencies
magic = [
    "python-magic>=0.4.27",
    "python-magic-bin; sys_platform == 'win32'",
]

# HTTP server rate limiting
http = [
    "slowapi>=0.1.9",
]

# Emulation tools
emulation = [
    "qiling>=1.4.6",
    "python-afl>=0.7.3",
]

# Digital forensics tools
forensics = [
    "volatility3>=2.4.0",
    "scapy>=2.5.0",
]

# Full installation (all features)
full = [
    "reversecore-mcp[analysis,viz,cli,magic,http,forensics]",
]

# Development & Testing dependencies
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "mypy>=2.1.0",
    "types-requests>=2.31.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-git-revision-date-localized-plugin>=1.5.2",
    "pip-tools>=7.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["reversecore_mcp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true   # Strict: explicit Optional[T] required
check_untyped_defs = true     # Strict: check untyped function definitions
disallow_untyped_defs = false # Allow gradual adoption

[[tool.mypy.overrides]]
module = [
    "reversecore_mcp.tools.*",
    "reversecore_mcp.dashboard.*",
    "reversecore_mcp.core.ghidra",
    "reversecore_mcp.core.ghidra_manager",
    "reversecore_mcp.core.ghidra_helper"
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "htmlcov", ".venv"]
# B101: assert used
# B108: hardcoded temp directory (acceptable for binary analysis tools)
# B110: try_except_pass (used for graceful degradation in analysis)
# B324: hashlib MD5 (used for file identification, not cryptographic purposes)
# B404, B603, B607: subprocess warnings (required for binary tools)
skips = ["B101", "B108", "B110", "B324", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["reversecore_mcp"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.setuptools]
packages = ["reversecore_mcp"]
