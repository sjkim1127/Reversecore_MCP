# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(bin|dat|raw|diff)$'
      - id: end-of-file-fixer
        exclude: '\.(bin|dat|raw)$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "reversecore_mcp/", "-ll"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # Type checking and repository hygiene checks
  - repo: local
    hooks:
      - id: mypy
        name: Type Check (mypy)
        entry: mypy reversecore_mcp/
        language: system
        pass_filenames: false
        files: ^reversecore_mcp/
      - id: check-action-pinning
        name: Check GitHub Action Pinning
        entry: python scripts/check_action_pinning.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
      - id: check-tool-hygiene
        name: Check Tool Hygiene
        entry: python scripts/check_tool_hygiene.py
        language: system
        pass_filenames: false
        files: ^reversecore_mcp/
