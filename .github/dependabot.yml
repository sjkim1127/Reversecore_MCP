version: 2
updates:
  # Maintain dependencies for pip
  # Automated version updates for pip lockfile (requirements.txt) are disabled
  # because lockfiles must be deterministically compiled via scripts/compile-requirements.sh
  # to preserve ABI compatibility (angr/capstone, fastmcp, etc.).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # angr 9.2.213 requires exact ABI-compatible capstone release
      - dependency-name: "capstone"
      # FastMCP 4.x introduces breaking API changes; retain pinned 3.x
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "python"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
