name: FastMCP 3 Compatibility Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fastmcp3:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y radare2 yara libyara-dev binutils binwalk build-essential nasm sleuthkit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install current environment and clean FastMCP 3.4.4
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip uninstall -y fastmcp fastmcp-slim
          pip install --no-cache-dir 'fastmcp==3.4.4'
      - name: Capture compatibility diagnostics
        shell: bash
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: INFO
        run: |
          mkdir -p diagnostics tests/fixtures/workspace tests/fixtures/rules
          set +e
          python -m pip check > diagnostics/pip-check.txt 2>&1
          echo $? > diagnostics/pip-check.status
          python - <<'PY' > diagnostics/server-smoke.txt 2>&1
          import asyncio
          import traceback
          import fastmcp
          print('fastmcp:', getattr(fastmcp, '__version__', 'unknown'))
          try:
              import reversecore_mcp.server as server
              print('plugins:', len(server.plugins))
              print('plugin names:', [getattr(p, 'name', type(p).__name__) for p in server.plugins])
              methods = [name for name in dir(server.mcp) if name in {'get_prompts', 'list_prompts', 'get_tools', 'list_tools'}]
              print('registry methods:', methods)
              if hasattr(server.mcp, 'list_prompts'):
                  prompts = asyncio.run(server.mcp.list_prompts())
              else:
                  prompts = asyncio.run(server.mcp.get_prompts())
              print('prompts:', len(prompts))
              print('http app:', type(server.mcp.http_app()))
          except Exception:
              traceback.print_exc()
              raise
          PY
          echo $? > diagnostics/server-smoke.status
          pytest tests/unit/ -v --tb=long --maxfail=20 --cov=reversecore_mcp --cov-report=term-missing --cov-fail-under=80 > diagnostics/pytest.txt 2>&1
          echo $? > diagnostics/pytest.status
          mypy reversecore_mcp/ > diagnostics/mypy.txt 2>&1
          echo $? > diagnostics/mypy.status
          pip freeze > diagnostics/pip-freeze.txt
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: fastmcp3-compatibility
          path: diagnostics/
          if-no-files-found: error
