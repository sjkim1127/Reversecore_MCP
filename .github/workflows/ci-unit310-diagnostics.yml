name: Python 3.10 Unit Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit310:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y radare2 yara libyara-dev binutils binwalk build-essential nasm sleuthkit
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Capture unit failures
        shell: bash
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: INFO
        run: |
          mkdir -p diagnostics tests/fixtures/workspace tests/fixtures/rules
          set +e
          pytest tests/unit/ -v --tb=long --maxfail=5 --cov=reversecore_mcp --cov-report=term-missing --cov-fail-under=80 > diagnostics/pytest310.txt 2>&1
          echo $? > diagnostics/pytest310.status
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: unit310-diagnostics
          path: diagnostics/
          if-no-files-found: error
