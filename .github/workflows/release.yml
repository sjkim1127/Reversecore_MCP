name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/sjkim1127/reversecore_mcp
  BASE_IMAGE: ghcr.io/sjkim1127/reversecore_mcp/base
  BASE_TAG: yara4.3.1-r2-6.0.4-r2ghidra-v6

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tags must point to a commit contained in main" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag and release metadata
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Generate SBOM — CycloneDX
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: cyclonedx-json
          artifact-name: reversecore-mcp-${{ github.ref_name }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate SBOM — SPDX
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: spdx-json
          artifact-name: reversecore-mcp-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

  publish-pypi:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reversecore-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish package using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true  # re-runs won't fail if version already published

  publish-oci:
    name: Publish versioned OCI image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag and release metadata
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Resolve image tags
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major_minor}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: mode=max
          sbom: true

  publish-mcp-registry:
    name: Publish metadata to the official MCP Registry
    needs: [publish-pypi, publish-oci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag and release metadata
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Install official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/${archive}" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "MCP Registry publication failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Registry or package metadata may still be propagating; retrying in ${delay}s"
            sleep "${delay}"
          done

  github-release:
    name: Create GitHub release
    needs: [publish-pypi, publish-oci, publish-mcp-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@v8
        with:
          name: reversecore-mcp-${{ github.ref_name }}.cdx.json
          path: sbom/

      - name: Download SPDX SBOM
        uses: actions/download-artifact@v8
        with:
          name: reversecore-mcp-${{ github.ref_name }}.spdx.json
          path: sbom/

      - name: Create release and attach distributions and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* sbom/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Reversecore MCP ${GITHUB_REF_NAME}" || \
          gh release upload "${GITHUB_REF_NAME}" dist/* sbom/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
