name: Smoke Log Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed smoke job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/86610909166/logs" \
            > diagnostics/smoke-job.log
          grep -n -A160 -B30 -E "BLOCKING FAILURES|FAIL|Traceback|AssertionError|AttributeError|TypeError|ImportError|ERROR" \
            diagnostics/smoke-job.log > diagnostics/smoke-excerpt.txt || true
          tail -500 diagnostics/smoke-job.log > diagnostics/smoke-tail.txt
      - uses: actions/upload-artifact@v6
        with:
          name: smoke-log-diagnostics
          path: diagnostics/
          if-no-files-found: error
