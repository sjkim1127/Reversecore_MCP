name: Release Metadata Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "PYPI_README.md"
      - "server.json"
      - "Dockerfile"
      - "reversecore_mcp/__init__.py"
      - "reversecore_mcp/py.typed"
      - "scripts/check_release_metadata.py"
      - ".github/workflows/release*.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "PYPI_README.md"
      - "server.json"
      - "Dockerfile"
      - "reversecore_mcp/__init__.py"
      - "reversecore_mcp/py.typed"
      - "scripts/check_release_metadata.py"
      - ".github/workflows/release*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate package and registry metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate synchronized release metadata
        run: python scripts/check_release_metadata.py

      - name: Install validation tools
        run: python -m pip install --upgrade build twine check-jsonschema

      - name: Validate official MCP Registry schema
        run: |
          set -o pipefail
          check-jsonschema \
            --schemafile https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            server.json 2>&1 | tee schema-validation.log

      - name: Build wheel and source distribution
        run: |
          set -o pipefail
          python -m build 2>&1 | tee package-build.log

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-diagnostics
          path: "*.log"
          if-no-files-found: warn
          retention-days: 7

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              required = {
                  "reversecore_mcp/__init__.py",
                  "reversecore_mcp/server.py",
                  "reversecore_mcp/py.typed",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel is missing required files: {sorted(missing)}")

              if not any(name.startswith("reversecore_mcp/tools/") for name in names):
                  raise SystemExit("wheel does not contain the MCP tool packages")

              entry_points_name = next(
                  (name for name in names if name.endswith(".dist-info/entry_points.txt")),
                  None,
              )
              if not entry_points_name:
                  raise SystemExit("wheel does not contain console entry-point metadata")
              entry_points = wheel.read(entry_points_name).decode("utf-8")
              expected = "reversecore-mcp = reversecore_mcp.server:main"
              if expected not in entry_points:
                  raise SystemExit(f"missing console entry point: {expected}")

          print(f"validated wheel: {wheels[0]}")
          PY

  patch-docker-qiling-isolation:
    name: Patch Docker Qiling isolation
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Remove mutable Qiling install from Docker E2E
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/main.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          # 3. Install dev requirements and optional python packages, then run Integration Tests inside Docker
          echo "📋 Installing python dev dependencies and optional tools inside container..."
          docker exec -u root mcp-ci-test /opt/venv/bin/pip install -r /app/requirements-dev.txt
          docker exec -u root mcp-ci-test /opt/venv/bin/pip install angr qiling flare-capa
'''
          new = '''          # 3. Verify the immutable locked runtime, then run Integration Tests inside Docker
          echo "📋 Verifying locked Python dependencies inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pip check
          docker exec mcp-ci-test python -c "import importlib.util; assert importlib.util.find_spec('qiling') is None, 'Qiling must remain isolated from the server runtime'"
'''
          if old not in text:
              raise SystemExit('expected Docker integration dependency block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit workflow hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/main.yml
          git commit -m 'security(ci): keep Qiling isolated in Docker E2E'
          git push origin HEAD:main
