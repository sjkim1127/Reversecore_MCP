name: Release Metadata Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "PYPI_README.md"
      - "server.json"
      - "Dockerfile"
      - "reversecore_mcp/__init__.py"
      - "reversecore_mcp/py.typed"
      - "scripts/check_release_metadata.py"
      - ".github/workflows/release*.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "PYPI_README.md"
      - "server.json"
      - "Dockerfile"
      - "reversecore_mcp/__init__.py"
      - "reversecore_mcp/py.typed"
      - "scripts/check_release_metadata.py"
      - ".github/workflows/release*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate package and registry metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate synchronized release metadata
        run: python scripts/check_release_metadata.py

      - name: Install validation tools
        run: python -m pip install --upgrade build twine check-jsonschema

      - name: Validate official MCP Registry schema
        run: |
          set -o pipefail
          check-jsonschema \
            --schemafile https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            server.json 2>&1 | tee schema-validation.log

      - name: Build wheel and source distribution
        run: |
          set -o pipefail
          python -m build 2>&1 | tee package-build.log

      - name: Upload validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-diagnostics
          path: "*.log"
          if-no-files-found: warn
          retention-days: 7

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              required = {
                  "reversecore_mcp/__init__.py",
                  "reversecore_mcp/server.py",
                  "reversecore_mcp/py.typed",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel is missing required files: {sorted(missing)}")

              if not any(name.startswith("reversecore_mcp/tools/") for name in names):
                  raise SystemExit("wheel does not contain the MCP tool packages")

              entry_points_name = next(
                  (name for name in names if name.endswith(".dist-info/entry_points.txt")),
                  None,
              )
              if not entry_points_name:
                  raise SystemExit("wheel does not contain console entry-point metadata")
              entry_points = wheel.read(entry_points_name).decode("utf-8")
              expected = "reversecore-mcp = reversecore_mcp.server:main"
              if expected not in entry_points:
                  raise SystemExit(f"missing console entry point: {expected}")

          print(f"validated wheel: {wheels[0]}")
          PY

  verify-main-push-deployment:
    name: Verify latest main push deployment
    runs-on: ubuntu-latest
    steps:
      - name: Poll current main CI/CD run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          echo "Current main SHA: ${main_sha}"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=100" \
              --jq ".workflow_runs | map(select(.name == \"CI/CD Pipeline\" and .head_sha == \"${main_sha}\")) | sort_by(.created_at) | reverse | .[0].id // empty")
            if [ -n "${run_id}" ]; then
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
              echo "Run ${run_id}: status=${status} conclusion=${conclusion}"
              if [ "${status}" = "completed" ]; then
                break
              fi
            else
              echo "No CI/CD push run for ${main_sha} yet"
            fi
            sleep 15
          done

          if [ -z "${run_id}" ]; then
            echo "No CI/CD Pipeline push run found for current main" >&2
            exit 1
          fi

          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
          echo "=== Jobs for main push run ${run_id} ==="
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv'

          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo "Current main push CI/CD did not succeed: status=${status} conclusion=${conclusion}" >&2
            exit 1
          fi
