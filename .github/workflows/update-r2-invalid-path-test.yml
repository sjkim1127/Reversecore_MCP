name: Update Radare2 invalid path test

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/update_r2_invalid_path_contract_test.py"
      - ".github/workflows/update-r2-invalid-path-test.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/runtime-r2-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: python -m pip install --disable-pip-version-check ruff

      - name: Update contract test
        run: python scripts/update_r2_invalid_path_contract_test.py

      - name: Validate updated test
        run: |
          set -euo pipefail
          ruff check --fix tests/unit/tools/radare2/test_radare2_mcp_tools.py
          ruff format tests/unit/tools/radare2/test_radare2_mcp_tools.py
          python -m compileall -q tests/unit/tools/radare2/test_radare2_mcp_tools.py
          grep -q 'test_validation_error_fails_closed' \
            tests/unit/tools/radare2/test_radare2_mcp_tools.py

      - name: Commit updated contract test
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: enforce fail-closed radare2 path validation"
          git push origin HEAD:${{ github.head_ref }}
