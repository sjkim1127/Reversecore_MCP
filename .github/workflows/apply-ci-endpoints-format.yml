name: Apply Endpoints Format Fix

on:
  push:
    branches:
      - ci/verify-main-20260712-9d051e0
    paths:
      - .github/ci-endpoints-format.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply Ruff formatting
        run: |
          git apply --check .github/ci-endpoints-format.patch
          git apply .github/ci-endpoints-format.patch
          rm -f .github/ci-endpoints-format.patch
          rm -f .github/workflows/apply-ci-endpoints-format.yml
      - name: Commit formatting fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format optional magic import block"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
