name: Apply CI Fix

on:
  push:
    branches:
      - ci/verify-main-20260712-9d051e0
    paths:
      - .github/ci-fix.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply validated patch and remove diagnostics
        run: |
          git apply --check .github/ci-fix.patch
          git apply .github/ci-fix.patch
          rm -f .github/ci-fix.patch
          rm -f .github/ci-verification-probe.txt
          rm -f .github/workflows/apply-ci-fix.yml
          rm -f .github/workflows/ci-diagnostics.yml
          rm -f .github/workflows/ci-source-export.yml
          rm -f .github/workflows/ci-fastmcp-introspection.yml
      - name: Commit fixes to verification branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ci): resolve wheel imports, prompt API, and type checks"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
