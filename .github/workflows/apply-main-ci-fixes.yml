name: Apply Main CI Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'ci/diagnose-main-6db0078'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/diagnose-main-6db0078
      - name: Format middleware and mount CI policy package
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          python -m ruff format reversecore_mcp/web/middleware.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/main.yml')
          content = path.read_text()
          workspace = '$' + '{{ github.workspace }}'
          anchor = f'            -v {workspace}/requirements-dev.txt:/app/requirements-dev.txt \\\n'
          addition = anchor + f'            -v {workspace}/ci:/app/ci:ro \\\n'
          if '/app/ci:ro' not in content:
              if anchor not in content:
                  raise SystemExit('requirements-dev mount anchor not found')
              content = content.replace(anchor, addition, 1)
          path.write_text(content)
          PY
          git diff --check
      - uses: actions/upload-artifact@v6
        with:
          name: main-ci-patched-files
          path: |
            .github/workflows/main.yml
            reversecore_mcp/web/middleware.py
          include-hidden-files: true
          if-no-files-found: error
