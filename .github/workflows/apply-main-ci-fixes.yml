name: Apply Main CI Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ci/diagnose-main-6db0078'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/diagnose-main-6db0078
          fetch-depth: 0
      - name: Format middleware and mount CI policy package
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.21
          ruff format reversecore_mcp/web/middleware.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/main.yml')
          content = path.read_text()
          anchor = '            -v ${{ github.workspace }}/requirements-dev.txt:/app/requirements-dev.txt \\\n'
          addition = anchor + '            -v ${{ github.workspace }}/ci:/app/ci:ro \\\n'
          if '/app/ci:ro' not in content:
              if anchor not in content:
                  raise SystemExit('requirements-dev mount anchor not found')
              content = content.replace(anchor, addition, 1)
          path.write_text(content)
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reversecore_mcp/web/middleware.py .github/workflows/main.yml
          git diff --cached --check
          git commit -m "fix(ci): format middleware and mount audit policy"
          git push origin HEAD:ci/diagnose-main-6db0078
