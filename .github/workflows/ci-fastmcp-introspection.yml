name: FastMCP Introspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-fastmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install fastmcp==2.14.7
      - name: Inspect prompt APIs
        run: |
          mkdir -p diagnostics
          python - <<'PY' > diagnostics/fastmcp-prompts.txt 2>&1
          import asyncio
          import inspect
          from fastmcp import FastMCP
          from reversecore_mcp.prompts import register_prompts

          mcp = FastMCP('prompt-test')
          register_prompts(mcp)
          attrs = [name for name in dir(mcp) if 'prompt' in name.lower()]
          print('attrs:', attrs)
          for name in attrs:
              value = getattr(mcp, name)
              print(name, type(value), end=' ')
              try:
                  print(inspect.signature(value))
              except Exception as exc:
                  print('signature-error', exc)
          for name in ['list_prompts', '_list_prompts', 'get_prompts']:
              if not hasattr(mcp, name):
                  continue
              method = getattr(mcp, name)
              print('calling', name)
              try:
                  result = method()
                  if inspect.isawaitable(result):
                      result = asyncio.run(result)
                  print('result type:', type(result))
                  print('result repr:', repr(result))
                  if hasattr(result, 'prompts'):
                      print('prompt names:', [p.name for p in result.prompts])
                  elif isinstance(result, (list, tuple)):
                      print('prompt names:', [p.name for p in result])
              except Exception as exc:
                  print('call-error:', type(exc).__name__, str(exc))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fastmcp-prompt-introspection
          path: diagnostics/fastmcp-prompts.txt
          if-no-files-found: error
