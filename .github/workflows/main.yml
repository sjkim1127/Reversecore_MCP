name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ── Computed globals ──────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  # Tool versions — bump these to trigger a base image rebuild
  YARA_VERSION: "4.3.1"
  RADARE2_VERSION: "6.0.4"
  # Base image tag is derived from the tool versions so cache busts automatically
  # when any tool version changes.
  # NOTE: Ghidra/JDK are NOT installed — we use r2ghidra (embedded Ghidra decompiler in radare2).
  BASE_TAG: "yara4.3.1-r2-6.0.4-r2ghidra-v3"

jobs:
  lint-and-security:
    name: Lint & Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "bandit[toml]" pip-audit

      - name: Run Ruff check
        run: ruff check reversecore_mcp/

      - name: Run Ruff format check
        run: ruff format --check reversecore_mcp/

      - name: Run Mypy type check
        run: mypy reversecore_mcp/

      - name: Run Bandit security scan
        run: bandit -r reversecore_mcp/ -c pyproject.toml

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln CVE-2026-0994 \
            --ignore-vuln CVE-2024-6345 \
            --ignore-vuln GHSA-2689-5p89-6j3j \
            --ignore-vuln GHSA-hm2w-vr2p-hq7w \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2025-49 \
            --ignore-vuln PYSEC-2026-3544


      - name: Create test workspace for security tests
        run: |
          mkdir -p tests/fixtures/workspace
          mkdir -p tests/fixtures/rules

      - name: Run security regression boundary tests
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: INFO
        run: |
          pytest tests/ -m security -v

  unit-and-integration-tests:
    name: Host Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # Remove problematic third-party repositories that cause 403 Forbidden errors on Ubuntu 24.04 (Noble) runners
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y radare2 yara libyara-dev binutils binwalk build-essential nasm sleuthkit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test workspace
        run: |
          mkdir -p tests/fixtures/workspace
          mkdir -p tests/fixtures/rules

      - name: Run unit tests & collect coverage
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: INFO
        run: |
          pytest tests/unit/ -v \
            --cov=reversecore_mcp \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Run security boundary tests
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: INFO
        run: |
          pytest tests/security/ -m security -v --tb=short

  wheel-smoke-test:
    name: Wheel Build & Install Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Test install wheel
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
      - name: Verify plugin discovery
        run: |
          cd /tmp
          $GITHUB_WORKSPACE/test_env/bin/python -c "import reversecore_mcp.server as s; assert len(s.plugins) > 0, 'No plugins discovered from installed wheel!'"

  docker-verification:
    name: Docker & E2E Integration Verification
    runs-on: ubuntu-latest
    needs: [merge-base-image]
    if: always()  # run even when merge-base-image is skipped (PRs)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test workspace
        run: |
          mkdir -p tests/fixtures/workspace
          mkdir -p tests/fixtures/rules
          mkdir -p tests/fixtures/workspace/binaries
          echo -n "Hello World" > tests/fixtures/workspace/test_binary.bin
          printf '\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00\x01\x00\x00\x00' > tests/fixtures/workspace/sample.elf
          # Pre-populate YARA rules directory (mirrors the unit-and-integration-tests job)
          python3 scripts/generate-ci-yara-rules.py
          echo "✅ YARA baseline rule created"

      - name: Cache test binaries
        uses: actions/cache@v6
        id: binaries-cache
        with:
          path: tests/fixtures/workspace/binaries
          key: test-binaries-${{ runner.os }}-${{ hashFiles('scripts/fetch_test_binaries.py') }}
          restore-keys: test-binaries-${{ runner.os }}-

      - name: Generate test binaries
        if: steps.binaries-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch_test_binaries.py

      - name: Generate PE and large binaries
        run: |
          python3 scripts/generate-pe-and-large-binaries.py

      - name: Log in to GHCR (for base image pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker  # Uses bundled BuildKit — no Docker Hub pull needed

      - name: Ensure base image is available
        run: |
          BASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/base"
          echo "BASE_IMAGE=${BASE_IMAGE}" >> $GITHUB_ENV
          BASE_TAG="${{ env.BASE_TAG }}"
          echo "🔍 Checking for base image ${BASE_IMAGE}:${BASE_TAG} in registry..."
          if docker pull "${BASE_IMAGE}:${BASE_TAG}" 2>/dev/null; then
            echo "✅ Base image pulled from GHCR registry"
          else
            echo "⚠️  Base image not in registry — building locally from Dockerfile.base"
            echo "(This is expected on PRs and the first push before build-base-image runs)"
            docker buildx build \
              --load \
              --target base \
              --build-arg YARA_VERSION="${{ env.YARA_VERSION }}" \
              --build-arg RADARE2_VERSION="${{ env.RADARE2_VERSION }}" \
              --build-arg GHIDRA_VERSION="${{ env.GHIDRA_VERSION }}" \
              --build-arg GHIDRA_DATE="${{ env.GHIDRA_DATE }}" \
              --cache-from "type=registry,ref=${BASE_IMAGE}:${BASE_TAG}" \
              --cache-to "type=inline" \
              -t "${BASE_IMAGE}:${BASE_TAG}" \
              -f Dockerfile.base .
            echo "✅ Base image built locally and tagged as ${BASE_IMAGE}:${BASE_TAG}"
          fi

      - name: Build app Docker image
        run: |
          echo "🐳 Building app image from base..."
          docker build \
            --build-arg BASE_IMAGE="${{ env.BASE_IMAGE }}" \
            --build-arg BASE_TAG="${{ env.BASE_TAG }}" \
            -t reversecore-mcp:ci .
          echo "✅ Docker image built: reversecore-mcp:ci"

      - name: Run Trivy container security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'reversecore-mcp:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'

      - name: Check Docker image size
        run: |
          SIZE=$(docker image inspect reversecore-mcp:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "📦 Docker image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 5000 ]; then
            echo "❌ Image size exceeds 5GB limit (${SIZE_MB}MB)"
            exit 1
          elif [ "$SIZE_MB" -gt 2000 ]; then
            echo "⚠️  Image size is large (${SIZE_MB}MB > 2GB)"
          fi

      - name: Check Dockerfile vs requirements.txt sync
        run: |
          chmod +x scripts/check-docker-requirements-sync.sh
          scripts/check-docker-requirements-sync.sh

      - name: Verify tools inside Docker container
        run: |
          echo "=== Checking tools INSIDE Docker image ==="
          docker run --rm reversecore-mcp:ci sh -c 'r2 -v' || echo "⚠️  radare2 not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'yara --version' || echo "⚠️  yara not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'file --version' || echo "⚠️  file not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'strings --version' || echo "⚠️  strings not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'nasm --version' || echo "⚠️  nasm not found in Docker (optional)"
          docker run --rm reversecore-mcp:ci sh -c 'binwalk --version' || echo "⚠️  binwalk not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'objdump --version | head -1' || echo "⚠️  objdump not found in Docker"
          docker run --rm reversecore-mcp:ci sh -c 'capa --version 2>/dev/null || echo "⚠️  capa not found in Docker (optional)"'
          docker run --rm reversecore-mcp:ci sh -c 'diec --version 2>/dev/null || echo "⚠️  diec not found in Docker (optional)"'
          echo "=== Docker tool verification complete ==="

      - name: Run real tool analysis on test binaries (Docker)
        run: |
          echo "🔬 Running real tool analysis INSIDE Docker container..."
          docker run --rm \
            -v ${{ github.workspace }}/tests/fixtures/workspace:/app/workspace \
            -e REVERSECORE_WORKSPACE=/app/workspace \
            reversecore-mcp:ci \
            bash -c '
              BIN_DIR="/app/workspace/binaries"
              if [ ! -d "$BIN_DIR" ]; then
                echo "❌ Binaries directory not found: $BIN_DIR"
                exit 1
              fi

              TARGET=""
              for f in hello_x64 hello_x64_stripped pie_x64 loop_x64; do
                if [ -f "$BIN_DIR/$f" ]; then
                  TARGET="$BIN_DIR/$f"
                  break
                fi
              done

              if [ -z "$TARGET" ]; then
                echo "⚠️ No compiled binaries found, creating minimal fallback..."
                printf "\x7fELF\x02\x01\x01\x00" > "$BIN_DIR/fallback.elf"
                TARGET="$BIN_DIR/fallback.elf"
              fi

              echo "📁 Target binary: $TARGET"
              echo ""

              echo "--- file ---"
              file "$TARGET"
              echo ""

              echo "--- strings ---"
              strings "$TARGET" | head -20 || true
              echo ""

              echo "--- radare2 disassembly (10 instructions) ---"
              r2 -q -c "pd 10" "$TARGET" 2>/dev/null || echo "⚠️ r2 disassembly skipped"
              echo ""

              echo "--- radare2 file info ---"
              r2 -q -c "iI" "$TARGET" 2>/dev/null || echo "⚠️ r2 info skipped"
              echo ""

              echo "--- objdump headers ---"
              objdump -h "$TARGET" 2>/dev/null || echo "⚠️ objdump skipped"
              echo ""

              echo "--- binwalk ---"
              binwalk "$TARGET" 2>/dev/null || echo "⚠️ binwalk skipped"
              echo ""

              echo "--- yara self-test ---"
              printf '\''rule test_elf {\n    strings:\n        $elf = { 7f 45 4c 46 }\n    condition:\n        $elf at 0\n}\n'\'' > "$BIN_DIR/ci_test.yar"
              yara "$BIN_DIR/ci_test.yar" "$TARGET" 2>/dev/null || echo "⚠️ yara test skipped"
              echo ""

              echo "✅ Real tool analysis complete (inside Docker)"
            '

      - name: Validate YARA rules (Docker)
        run: |
          echo "🔍 Validating YARA rule syntax inside Docker..."
          docker run --rm \
            -v ${{ github.workspace }}/tests/fixtures/rules:/app/rules \
            reversecore-mcp:ci \
            python /app/scripts/test-yara-rules.py /app/rules || echo "⚠️  YARA rule validation skipped"

      - name: MCP Server Integration Test (Docker)
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: WARNING
        run: |
          echo "🧪 Starting MCP Server Integration Test (Docker)..."
          docker run -d --name mcp-ci-test \
            -p 8765:8000 \
            -e REVERSECORE_WORKSPACE=/app/workspace \
            -e REVERSECORE_READ_DIRS=/app/rules \
            -e LOG_LEVEL=WARNING \
            -v ${{ github.workspace }}/tests/fixtures/workspace:/app/workspace \
            -v ${{ github.workspace }}/tests/fixtures/rules:/app/rules \
            -v ${{ github.workspace }}/tests:/app/tests \
            -v ${{ github.workspace }}/requirements-dev.txt:/app/requirements-dev.txt \
            -v ${{ github.workspace }}/pytest.ini:/app/pytest.ini \
            -v ${{ github.workspace }}/scripts:/app/scripts \
            reversecore-mcp:ci
          echo "⏳ Waiting for MCP server container to be ready..."
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "✅ MCP server in Docker is healthy"
              break
            fi
            echo "   Attempt $i/30: HTTP $code"
          done
          if [ "$code" != "200" ]; then
            echo "❌ MCP server in Docker did not become healthy"
            docker logs mcp-ci-test
            docker stop mcp-ci-test
            docker rm mcp-ci-test
            exit 1
          fi

          echo "🔑 Adjusting workspace permissions inside container..."
          docker exec -u root mcp-ci-test chown -R appuser:appuser /app/workspace

          # Install diec (Detect It Easy CLI) inside the container
          echo "📦 Installing Detect It Easy CLI (diec) inside container..."
          docker exec -u root mcp-ci-test sh -c '
            (curl -sSL "https://github.com/horsicq/DIE-engine/releases/download/3.09/die_lin64_portable_3.09.tar.gz" -o /tmp/die.tar.gz && \
             tar -xzf /tmp/die.tar.gz -C /opt && \
             ln -sf /opt/die_lin64_portable/diec /usr/local/bin/diec && \
             chmod +x /opt/die_lin64_portable/diec) || echo "⚠️ Optional diec installation failed"
          '

          # 1. Docker HEALTHCHECK status
          echo "🔍 Checking Docker HEALTHCHECK..."
          HEALTH=$(docker inspect --format='{{.State.Health.Status}}' mcp-ci-test 2>/dev/null || echo "unknown")
          echo "   Docker health status: $HEALTH"

          # 2. MCP tool registry + invocation test inside container
          echo "🔧 Checking MCP tool registry and invocation..."
          docker cp scripts/test-mcp-docker-tools.py mcp-ci-test:/tmp/test-mcp-docker-tools.py
          docker exec mcp-ci-test python /tmp/test-mcp-docker-tools.py

          # 3. Install dev requirements and optional python packages, then run Integration Tests inside Docker
          echo "📋 Installing python dev dependencies and optional tools inside container..."
          docker exec -u root mcp-ci-test /opt/venv/bin/pip install -r /app/requirements-dev.txt
          docker exec -u root mcp-ci-test /opt/venv/bin/pip install angr qiling flare-capa

          echo "🧪 Running real binary integration tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_mcp_real_binary_tools.py -v --tb=short

          echo "🧪 Running advanced analysis tool tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_advanced_analysis_tools.py -v --tb=short

          echo "🧪 Running tool installation & invocation tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_tool_installation.py -v --tb=short

          echo "🧪 Running real binary analysis tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_real_binary_analysis.py -v --tb=short

          echo "🧪 Running large binary processing tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_large_binary_processing.py -v --tb=short

          echo "🧪 Running extended tool tests inside container..."
          docker exec mcp-ci-test /opt/venv/bin/pytest /app/tests/integration/test_extended_tools.py -v --tb=short

          echo "📋 Calling ALL MCP tools comprehensively..."
          docker cp scripts/test-all-mcp-tools.py mcp-ci-test:/tmp/test-all-mcp-tools.py
          docker exec mcp-ci-test python /tmp/test-all-mcp-tools.py

          # 4. Container resilience: concurrent requests + restart
          echo "🔄 Testing container resilience..."
          docker cp scripts/test-container-resilience.py mcp-ci-test:/tmp/test-container-resilience.py
          docker exec mcp-ci-test python /tmp/test-container-resilience.py

          # 5. Dashboard and metrics endpoints
          echo "📊 Testing dashboard and metrics endpoints..."
          docker cp scripts/test-dashboard.py mcp-ci-test:/tmp/test-dashboard.py
          docker exec mcp-ci-test python /tmp/test-dashboard.py

          # 6. E2E: upload → analyze → result
          echo "🔄 Testing E2E upload → analyze → result..."
          docker cp scripts/test-e2e-upload-analyze.py mcp-ci-test:/tmp/test-e2e-upload-analyze.py
          docker exec mcp-ci-test python /tmp/test-e2e-upload-analyze.py

          echo "✅ MCP Server Docker integration test passed"
          docker stop mcp-ci-test
          docker rm mcp-ci-test
        timeout-minutes: 10

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ──────────────────────────────────────────────────────────────────────────
  # Build base image — matrix strategy: one native runner per architecture.
  # No QEMU emulation = 2× faster per-arch build.
  # driver: docker avoids pulling moby/buildkit from Docker Hub.
  # ──────────────────────────────────────────────────────────────────────────
  build-base-image:
    name: Build & Push Base Image (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: [lint-and-security]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Downcase repository name
        run: |
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/base" >> ${GITHUB_ENV}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker  # Uses bundled BuildKit — no Docker Hub pull needed

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base image already exists
        id: base-exists
        run: |
          if docker manifest inspect ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}-${{ matrix.suffix }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Base image ${{ env.BASE_TAG }}-${{ matrix.suffix }} already exists — skipping rebuild"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🔨 Base image ${{ env.BASE_TAG }}-${{ matrix.suffix }} not found — will build"
          fi

      - name: Build and Push base image (${{ matrix.platform }})
        if: steps.base-exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base
          platforms: ${{ matrix.platform }}
          push: true
          target: base
          build-args: |
            YARA_VERSION=${{ env.YARA_VERSION }}
            RADARE2_VERSION=${{ env.RADARE2_VERSION }}
            GHIDRA_VERSION=${{ env.GHIDRA_VERSION }}
            GHIDRA_DATE=${{ env.GHIDRA_DATE }}
          tags: ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}-${{ matrix.suffix }}
          # Inline cache embeds metadata in the pushed image — readable by
          # cache-from: type=registry on subsequent runs. Compatible with driver: docker.
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}-${{ matrix.suffix }}
          cache-to: type=inline

  # ──────────────────────────────────────────────────────────────────────────
  # Merge per-arch base image digests into a single multi-arch manifest list
  # ──────────────────────────────────────────────────────────────────────────
  merge-base-image:
    name: Merge Base Image Manifests
    runs-on: ubuntu-latest
    needs: [build-base-image]
    if: |
      always() && !cancelled() &&
      needs.build-base-image.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Downcase repository name
        run: |
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/base" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }} \
            --tag ${{ env.BASE_IMAGE }}:latest \
            ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}-amd64 \
            ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}-arm64
          echo "✅ Multi-arch manifest created: ${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Exploit Safety Gate: Runs security boundary tests inside a hardened
  # container (--network=none, --cap-drop=ALL, no-new-privileges).
  # Blocks deploy if any exploit tool escapes workspace or mishandles deps.
  # ──────────────────────────────────────────────────────────────────────────
  exploit-safety-gate:
    name: 🔒 Exploit Pipeline Safety Gate
    runs-on: ubuntu-latest
    needs: [lint-and-security, unit-and-integration-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y radare2 yara libyara-dev binutils nasm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "bandit[toml]"

      - name: Create isolated test workspace
        run: |
          mkdir -p tests/fixtures/workspace
          mkdir -p tests/fixtures/rules
          printf '\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00' \
            > tests/fixtures/workspace/target.elf

      - name: "🔍 Scan POC templates with Bandit"
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
        run: |
          echo "=== Extracting POC templates for static analysis ==="
          python3 - <<'EOF'
          import sys
          from reversecore_mcp.tools.malware.poc_generator import _POC_TEMPLATES
          import tempfile, os, subprocess

          violations = []
          with tempfile.TemporaryDirectory() as d:
              for name, src in _POC_TEMPLATES.items():
                  p = os.path.join(d, f"{name}.py")
                  with open(p, 'w') as f:
                      f.write(src)
              result = subprocess.run(
                  ["bandit", "-r", d, "-ll", "-ii",
                   "--skip", "B101,B603,B404",
                   "-f", "txt"],
                  capture_output=True, text=True
              )
              if "Issue:" in result.stdout:
                  print(result.stdout)
                  sys.exit(1)
              else:
                  print(f"✅ All {len(_POC_TEMPLATES)} POC templates passed bandit scan")
          EOF

      - name: "🔒 Run exploit security boundary tests (host)"
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: WARNING
        run: |
          pytest tests/security/ -m security -v --tb=short

      - name: "🌪️ Run Quick Fuzzing (DAST) on core parsers"
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: WARNING
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/security/test_fuzzing_hypothesis.py -v --tb=short

      - name: "⏱️ Run Performance Regression (SLA Benchmark)"
        env:
          REVERSECORE_WORKSPACE: ${{ github.workspace }}/tests/fixtures/workspace
          REVERSECORE_READ_DIRS: ${{ github.workspace }}/tests/fixtures/rules
          LOG_LEVEL: WARNING
        run: |
          pytest tests/performance/test_performance_regression.py -v --tb=short --benchmark-warmup=on

      - name: "🚧 Verify workspace isolation under network restriction (Docker)"
        run: |
          docker run --rm \
            --network=none \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp \
            --volume ${{ github.workspace }}/tests/fixtures/workspace:/workspace:ro \
            -e REVERSECORE_WORKSPACE=/workspace \
            python:3.11-slim \
            python3 -c "
          import subprocess, sys
          # Verify network is blocked
          try:
              import socket
              s = socket.create_connection(('8.8.8.8', 53), timeout=2)
              s.close()
              print('FAIL: Network is NOT blocked in hardened container')
              sys.exit(1)
          except OSError:
              print('PASS: Network correctly blocked (--network=none confirmed)')
          "
        timeout-minutes: 2

  # ──────────────────────────────────────────────────────────────────────────
  # Smoke Test: Build app image, start container, verify ALL tools work
  # CI pass = tools actually function (not just mock-tested)
  # ──────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: 🩺 In-Container Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, merge-base-image]
    if: always() && !cancelled() && (needs.unit-and-integration-tests.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/base" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker  # Uses bundled BuildKit — no Docker Hub pull needed

      - name: Build app image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
          tags: reversecore-mcp:smoke
          cache-from: |
            type=registry,ref=${{ env.BASE_IMAGE }}:cache-${{ env.BASE_TAG }}
            type=gha,scope=app

      - name: Start container for smoke test
        run: |
          docker run -d --name mcp-smoke \
            -e MCP_TRANSPORT=stdio \
            -e LOG_LEVEL=WARNING \
            -v ${{ github.workspace }}/workspace:/app/workspace \
            reversecore-mcp:smoke \
            sleep infinity
          echo "Container started: $(docker ps --filter name=mcp-smoke --format '{{.Status}}')"

      - name: Copy fixture binary into container
        run: |
          mkdir -p ${{ github.workspace }}/workspace
          docker cp tests/fixtures/smoke_test_elf mcp-smoke:/app/workspace/smoke_test_elf
          echo "Fixture copied into container workspace"

      - name: 🧪 Run smoke tests inside container
        run: |
          docker exec mcp-smoke \
            /opt/venv/bin/python /app/scripts/smoke_test.py
        # Non-zero exit = required tool broken = CI FAILS → deploy blocked

      - name: Collect smoke test logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs mcp-smoke --tail 100 || true
          echo "=== Installed packages ==="
          docker exec mcp-smoke /opt/venv/bin/pip list | grep -E 'fastmcp|lief|yara|r2pipe|radare' || true

      - name: Cleanup
        if: always()
        run: |
          docker stop mcp-smoke || true
          docker rm mcp-smoke || true

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy: Build lightweight app image — matrix strategy, one native runner
  # per architecture to avoid QEMU overhead.
  # driver: docker avoids pulling moby/buildkit from Docker Hub.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Docker Build & Push (CD) (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: [lint-and-security, unit-and-integration-tests, docker-verification, smoke-test, exploit-safety-gate, codeql-analysis, merge-base-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Downcase repository name for Docker image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/base" >> ${GITHUB_ENV}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker  # Uses bundled BuildKit — no Docker Hub pull needed

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push app image (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          # Inline cache embeds metadata in the pushed image — readable by
          # cache-from: type=registry on subsequent runs. Compatible with driver: docker.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          cache-to: type=inline

  # ──────────────────────────────────────────────────────────────────────────
  # Merge per-arch app image digests into a single multi-arch manifest list
  # and run Trivy on the final image.
  # ──────────────────────────────────────────────────────────────────────────
  merge-deploy:
    name: Merge App Image Manifests & Security Scan
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Create and push multi-arch app manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64 \
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          echo "✅ Multi-arch app manifest created: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
