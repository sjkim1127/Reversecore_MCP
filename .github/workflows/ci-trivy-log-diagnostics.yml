name: Trivy Log Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Docker job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/86609242895/logs" \
            > diagnostics/docker-job.log
          grep -n -A120 -B20 -E "Trivy|Total:|CRITICAL|HIGH|MEDIUM|LOW|Vulnerability" \
            diagnostics/docker-job.log > diagnostics/trivy-excerpt.txt || true
      - uses: actions/upload-artifact@v6
        with:
          name: trivy-log-diagnostics
          path: diagnostics/
          if-no-files-found: error
