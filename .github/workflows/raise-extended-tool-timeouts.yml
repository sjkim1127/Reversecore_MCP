name: Raise extended tool timeouts

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/raise_extended_tool_timeouts.py"
      - ".github/workflows/raise-extended-tool-timeouts.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/runtime-r2-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: python -m pip install --disable-pip-version-check ruff

      - name: Apply timeout hardening
        run: python scripts/raise_extended_tool_timeouts.py

      - name: Validate generated test module
        run: |
          set -euo pipefail
          ruff check --fix tests/integration/test_extended_tools.py
          ruff format tests/integration/test_extended_tools.py
          python -m compileall -q tests/integration/test_extended_tools.py
          if grep -n 'timeout=5' tests/integration/test_extended_tools.py; then
            echo "Five-second external-tool timeout remains"
            exit 1
          fi

      - name: Commit generated test hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: stabilize external tool integration timeouts"
          git push origin HEAD:${{ github.head_ref }}
