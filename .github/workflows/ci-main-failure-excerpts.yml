name: Main CI Failure Excerpts

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'ci/diagnose-main-6db0078'
    runs-on: ubuntu-latest
    steps:
      - name: Collect current pip-audit failure excerpt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/86807807265/logs" \
            > diagnostics/lint.log
          grep -n -A120 -B60 -E "reversecore-ci|Found [0-9]+ known vulnerabilities|Name +Version +ID|CVE-|PYSEC-|pip-audit|No known vulnerabilities|ERROR" \
            diagnostics/lint.log > diagnostics/pip-audit-excerpt.txt || true
          tail -500 diagnostics/lint.log > diagnostics/lint-tail.txt
      - uses: actions/upload-artifact@v6
        with:
          name: current-pip-audit-failure
          path: diagnostics/
          if-no-files-found: error
