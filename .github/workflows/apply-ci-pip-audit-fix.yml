name: Apply Pip Audit Policy Fix

on:
  push:
    branches:
      - ci/verify-main-20260712-9d051e0
    paths:
      - .github/ci-pip-audit-fix.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply pip-audit policy patch
        run: |
          git apply --check .github/ci-pip-audit-fix.patch
          git apply .github/ci-pip-audit-fix.patch
          rm -f .github/ci-pip-audit-fix.patch
          rm -f .github/workflows/apply-ci-pip-audit-fix.yml
          rm -f .github/workflows/ci-pip-audit-diagnostics.yml
      - name: Commit policy fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ci): document temporary Pillow audit exceptions"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
