name: Pip Audit Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "bandit[toml]" pip-audit
      - name: Capture pip-audit output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pip-audit \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln CVE-2026-0994 \
            --ignore-vuln CVE-2024-6345 \
            --ignore-vuln GHSA-2689-5p89-6j3j \
            --ignore-vuln GHSA-hm2w-vr2p-hq7w \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2025-49 \
            > diagnostics/pip-audit.txt 2>&1
          echo $? > diagnostics/pip-audit.status
          pip freeze > diagnostics/pip-freeze.txt
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: pip-audit-diagnostics
          path: diagnostics/
          if-no-files-found: error
