name: Apply Smoke Server Path Fix

on:
  push:
    branches:
      - ci/verify-main-20260712-9d051e0
    paths:
      - .github/smoke-server-path.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply server module path fix
        run: |
          git apply --check .github/smoke-server-path.patch
          git apply .github/smoke-server-path.patch
          rm -f .github/smoke-server-path.patch
      - name: Commit smoke fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/smoke_test.py .github/smoke-server-path.patch
          git commit -m "fix(ci): launch packaged server module in smoke test"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
