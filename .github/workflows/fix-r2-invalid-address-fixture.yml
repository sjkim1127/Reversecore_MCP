name: Fix Radare2 invalid address fixture

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fix_r2_invalid_address_fixture.py"
      - ".github/workflows/fix-r2-invalid-address-fixture.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/runtime-r2-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: python -m pip install --disable-pip-version-check ruff

      - name: Correct invalid-address fixture
        run: python scripts/fix_r2_invalid_address_fixture.py

      - name: Validate updated test
        run: |
          set -euo pipefail
          ruff check --fix tests/unit/tools/radare2/test_radare2_mcp_tools.py
          ruff format tests/unit/tools/radare2/test_radare2_mcp_tools.py
          python -m compileall -q tests/unit/tools/radare2/test_radare2_mcp_tools.py
          grep -q 'address="invalid;command"' \
            tests/unit/tools/radare2/test_radare2_mcp_tools.py

      - name: Commit corrected fixture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use a rejected radare2 address fixture"
          git push origin HEAD:${{ github.head_ref }}
