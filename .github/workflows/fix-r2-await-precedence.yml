name: Fix Radare2 await precedence

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fix_r2_await_precedence.py"
      - ".github/workflows/fix-r2-await-precedence.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/runtime-r2-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check ruff

      - name: Apply await correction
        run: python scripts/fix_r2_await_precedence.py

      - name: Validate generated source
        run: |
          set -euo pipefail
          ruff check --fix reversecore_mcp/tools/radare2/radare2_mcp_tools.py \
            tests/unit/tools/radare2/test_r2_runtime_hardening.py
          ruff format reversecore_mcp/tools/radare2/radare2_mcp_tools.py \
            tests/unit/tools/radare2/test_r2_runtime_hardening.py
          python -m compileall -q reversecore_mcp/tools/radare2/radare2_mcp_tools.py \
            tests/unit/tools/radare2/test_r2_runtime_hardening.py
          if grep -nE 'await self\._run_session_cmd\([^[:cntrl:]]+\)\.[A-Za-z_]' \
            reversecore_mcp/tools/radare2/radare2_mcp_tools.py; then
            echo "Unsafe await/member-access chain remains"
            exit 1
          fi

      - name: Commit corrected source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize awaited radare2 command results"
          git push origin HEAD:${{ github.head_ref }}
