name: Diagnose Radare2 runtime tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/unit/tools/radare2/test_r2_runtime_hardening.py"
      - "reversecore_mcp/tools/radare2/**"
      - ".github/workflows/diagnose-r2-runtime-tests.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest tests/unit/tools/radare2/test_r2_runtime_hardening.py \
            -vv --tb=long --no-cov 2>&1 | tee artifacts/pytest-r2-runtime.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2-runtime-test-log
          path: artifacts/pytest-r2-runtime.log
          if-no-files-found: error
