name: Apply Container Bind Guard From PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply container bind guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("reversecore_mcp/server.py")
          content = path.read_text()

          old_import = "from reversecore_mcp.web.middleware import SecurityHeadersMiddleware  # noqa: E402"
          new_import = (
              "from reversecore_mcp.web.middleware import (  # noqa: E402\n"
              "    LoopbackOnlyMiddleware,\n"
              "    SecurityHeadersMiddleware,\n"
              ")"
          )
          if old_import not in content:
              raise SystemExit("middleware import target not found")
          content = content.replace(old_import, new_import, 1)

          old_bind = (
              "        api_key = settings.api_key\n"
              "        host = settings.host\n"
              "\n"
              "        # Safe Bind Address Fallback (P0)\n"
              "        if not api_key:\n"
              "            if host != \"127.0.0.1\" and host != \"localhost\":\n"
              "                logger.warning(\n"
              "                    f\"⚠️ Safety warning: Binding to external interface '{host}' without an API key is unsafe. \"\n"
              "                    \"Overriding host binding to 127.0.0.1 (loopback) to prevent unauthorized access.\"\n"
              "                )\n"
              "                host = \"127.0.0.1\"\n"
          )
          new_bind = (
              "        api_key = settings.api_key\n"
              "        host = settings.host\n"
              "        use_loopback_guard = False\n"
              "\n"
              "        # Safe Bind Address Fallback (P0)\n"
              "        if not api_key:\n"
              "            if host != \"127.0.0.1\" and host != \"localhost\":\n"
              "                if Path(\"/.dockerenv\").exists():\n"
              "                    logger.warning(\n"
              "                        f\"⚠️ Container binding to '{host}' without an API key. \"\n"
              "                        \"Only public health endpoints and loopback clients will be allowed.\"\n"
              "                    )\n"
              "                    use_loopback_guard = True\n"
              "                else:\n"
              "                    logger.warning(\n"
              "                        f\"⚠️ Safety warning: Binding to external interface '{host}' without an API key is unsafe. \"\n"
              "                        \"Overriding host binding to 127.0.0.1 (loopback) to prevent unauthorized access.\"\n"
              "                    )\n"
              "                    host = \"127.0.0.1\"\n"
          )
          if old_bind not in content:
              raise SystemExit("safe-bind target block not found")
          content = content.replace(old_bind, new_bind, 1)

          old_stack = (
              "        # Enforce Security Headers\n"
              "        app.add_middleware(SecurityHeadersMiddleware)\n"
              "\n"
              "        # Enforce API Key globally if set (including on mounted sub-apps)\n"
          )
          new_stack = (
              "        # Enforce Security Headers\n"
              "        app.add_middleware(SecurityHeadersMiddleware)\n"
              "\n"
              "        # Container health probes may be external, but all other unauthenticated\n"
              "        # traffic must still originate from the container loopback interface.\n"
              "        if use_loopback_guard:\n"
              "            app.add_middleware(LoopbackOnlyMiddleware)\n"
              "\n"
              "        # Enforce API Key globally if set (including on mounted sub-apps)\n"
          )
          if old_stack not in content:
              raise SystemExit("middleware stack target not found")
          content = content.replace(old_stack, new_stack, 1)

          path.write_text(content)
          PY
          rm -f .github/container-bind-guard.patch
      - name: Commit server change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reversecore_mcp/server.py .github/container-bind-guard.patch
          git commit -m "security(http): guard unauthenticated container binds"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
