name: Docker E2E Log Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'ci/verify-main-20260712-9d051e0'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Docker E2E job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/86611556650/logs" \
            > diagnostics/docker-e2e-job.log
          grep -n -A180 -B50 -E "MCP Server Integration|Traceback|AssertionError|AttributeError|TypeError|ERROR|FAILED|curl:" \
            diagnostics/docker-e2e-job.log > diagnostics/docker-e2e-excerpt.txt || true
          tail -600 diagnostics/docker-e2e-job.log > diagnostics/docker-e2e-tail.txt
      - uses: actions/upload-artifact@v6
        with:
          name: docker-e2e-log-diagnostics
          path: diagnostics/
          if-no-files-found: error
