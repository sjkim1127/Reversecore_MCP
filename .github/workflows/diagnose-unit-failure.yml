name: Diagnose first unit regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-unit-failure.yml"

permissions:
  contents: read

jobs:
  first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run until first failure
        run: |
          mkdir -p artifacts
          set -o pipefail
          # Stop at the first regression after correcting the invalid-address fixture.
          pytest tests --maxfail=1 --tb=long --no-cov -vv \
            2>&1 | tee artifacts/first-unit-failure.log

      - name: Upload unit failure log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: first-unit-failure-log
          path: artifacts/first-unit-failure.log
          if-no-files-found: error
