name: Diagnose remaining unit regressions

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-unit-failure.yml"

permissions:
  contents: read

jobs:
  all-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete unit and integration suite
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest tests --tb=short --no-cov -q \
            2>&1 | tee artifacts/all-unit-regressions.log

      - name: Upload complete regression log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-unit-regressions-log
          path: artifacts/all-unit-regressions.log
          if-no-files-found: error
