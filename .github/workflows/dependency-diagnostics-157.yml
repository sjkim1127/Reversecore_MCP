name: Repair Dependency Lock 157

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 157
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Revert incompatible tibs major update
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^tibs==1.0.0$' requirements.txt
          sed -i 's/^tibs==1\.0\.0$/tibs==0.5.7/' requirements.txt
          grep -q '^tibs==0.5.7$' requirements.txt

      - name: Commit repaired lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt
          git commit -m 'fix(deps): revert incompatible tibs 1.0.0 update'
          git push origin HEAD:main
