name: Apply Radare2 hardening refactor

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply_r2_hardening_refactor.py"
      - ".github/workflows/apply-r2-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/runtime-r2-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install transformer tooling
        run: python -m pip install --disable-pip-version-check libcst ruff

      - name: Apply transformer
        run: python scripts/apply_r2_hardening_refactor.py

      - name: Format and validate generated source
        run: |
          set -euo pipefail
          ruff check --fix reversecore_mcp/core/config.py \
            reversecore_mcp/tools/radare2/r2_analysis.py \
            reversecore_mcp/tools/radare2/radare2_mcp_tools.py \
            tests/unit/tools/radare2/test_r2_runtime_hardening.py
          ruff format reversecore_mcp/core/config.py \
            reversecore_mcp/tools/radare2/r2_analysis.py \
            reversecore_mcp/tools/radare2/radare2_mcp_tools.py \
            tests/unit/tools/radare2/test_r2_runtime_hardening.py
          python -m compileall -q reversecore_mcp tests/unit/tools/radare2/test_r2_runtime_hardening.py
          bash scripts/check-docker-requirements-sync.sh

      - name: Commit generated refactor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: bound and async-isolate radare2 sessions"
          git push origin HEAD:${{ github.head_ref }}
