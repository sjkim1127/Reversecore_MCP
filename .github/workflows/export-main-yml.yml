name: Export Main Workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage workflow
        run: |
          mkdir -p workflow-export
          cp .github/workflows/main.yml workflow-export/main.yml
      - uses: actions/upload-artifact@v6
        with:
          name: main-workflow-export
          path: workflow-export/main.yml
          if-no-files-found: error
