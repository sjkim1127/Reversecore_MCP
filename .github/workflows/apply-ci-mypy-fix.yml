name: Apply CI Mypy Fix

on:
  push:
    branches:
      - ci/verify-main-20260712-9d051e0
    paths:
      - .github/ci-mypy-fix.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/verify-main-20260712-9d051e0
          fetch-depth: 0
      - name: Apply mypy fix
        run: |
          git apply --check .github/ci-mypy-fix.patch
          git apply .github/ci-mypy-fix.patch
          rm -f .github/ci-mypy-fix.patch
          rm -f .github/workflows/apply-ci-mypy-fix.yml
          rm -f .github/workflows/ci-mypy-diagnostics.yml
      - name: Commit mypy fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(types): narrow optional dependency health paths"
          git push origin HEAD:ci/verify-main-20260712-9d051e0
