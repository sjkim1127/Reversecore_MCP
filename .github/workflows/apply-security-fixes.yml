name: Apply security alert remediations

on:
  push:
    branches:
      - "fix/security-alerts"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: "fix/security-alerts"
          fetch-depth: 0

      - name: Apply repository patch
        run: python scripts/apply_nonworkflow_security_fixes.py

      - name: Validate generated fixtures and Python syntax
        run: |
          python scripts/generate-ci-fixtures.py
          python -m compileall -q reversecore_mcp/tools/report/report_tools.py tests/conftest.py scripts/generate-ci-fixtures.py

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remediate security scanning alerts"
          git push origin HEAD:fix/security-alerts
