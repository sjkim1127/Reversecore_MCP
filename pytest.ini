[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_test_loop_scope = session
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=reversecore_mcp
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=54
    --cov-config=.coveragerc
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
